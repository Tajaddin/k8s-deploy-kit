{{- if .Values.envFromConfigMap.enabled -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "webapp.fullname" . }}-config
  labels:
    {{- include "webapp.labels" . | nindent 4 }}
data:
  {{- range $k, $v := .Values.envFromConfigMap.data }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
{{- end }}
