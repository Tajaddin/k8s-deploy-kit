apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: webapp-dev
namePrefix: dev-

resources:
  - ../../base

commonLabels:
  app.kubernetes.io/instance: dev

patches:
  - target:
      kind: Deployment
      name: webapp
    patch: |
      - op: replace
        path: /spec/replicas
        value: 1
