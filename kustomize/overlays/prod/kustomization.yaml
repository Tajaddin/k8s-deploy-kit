apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: webapp-prod
namePrefix: prod-

resources:
  - ../../base

# Prod never floats on :latest. A release pipeline (not part of this kit) should
# pin the built digest instead: kustomize edit set image ghcr.io/example/webapp@sha256:<digest>
images:
  - name: ghcr.io/example/webapp
    newTag: "0.1.0"

commonLabels:
  app.kubernetes.io/instance: prod

patches:
  - target:
      kind: Deployment
      name: webapp
    patch: |
      - op: replace
        path: /spec/replicas
        value: 4
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: 250m
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/cpu
        value: 1
